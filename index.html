<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>KSK Kalkulationstrainer</title>
<style>
  :root {
    --bg: #f4f6f9; --card: #fff; --ink: #1c2430; --muted: #5d6b7e; --line: #d8dee8;
    --accent: #1f5fbf; --accent-ink: #fff;
    --ok: #1d7a3e; --ok-bg: #e6f5ec;
    --bad: #b3261e; --bad-bg: #fcebea;
    --follow: #8a5a00; --follow-bg: #fff4d6;
    --neutral-bg: #eef1f5;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink); line-height: 1.45; }
  header { background: var(--accent); color: var(--accent-ink); padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  header h1 { margin: 0; font-size: 1.25rem; }
  header .calc-toggle { font: inherit; font-size: .9rem; padding: 7px 14px; border-radius: 8px; border: 1px solid rgba(255,255,255,.6); background: transparent; color: var(--accent-ink); cursor: pointer; }
  header .calc-toggle[aria-pressed="true"] { background: #fff; color: var(--accent); }
  main { max-width: 980px; margin: 0 auto; padding: 18px 16px 60px; }

  .tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .tab { border: 1px solid var(--line); background: var(--card); color: var(--ink); padding: 8px 12px; border-radius: 8px; cursor: pointer; font: inherit; font-size: .9rem; text-align: left; }
  .tab.active { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent) inset; }
  .tab small { display: block; color: var(--muted); font-size: .75rem; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin-bottom: 14px; }
  .task { font-size: 1.02rem; margin: 0; white-space: pre-line; line-height: 1.55; }
  .task-hint { font-size: .8rem; color: var(--muted); margin-top: 12px; }
  .task-hint:empty { display: none; }
  .konto { margin: 12px 0; font-size: .86rem; white-space: normal; container-type: inline-size; }
  .konto-wide { display: none; border-collapse: collapse; table-layout: fixed; width: 100%; }
  .konto-wide { font-size: .84rem; }
  .konto-wide th { border-bottom: 2px solid var(--ink); padding: 4px 6px; text-align: left; }
  .konto-wide td { padding: 4px 6px; vertical-align: top; }
  .konto-wide td.lb { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .konto-wide td.n { padding-right: 12px; text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .konto-wide .hv { border-left: 2px solid var(--ink); }
  .konto-wide tr.sum td { border-top: 1px solid var(--ink); border-bottom: 3px double var(--ink); font-weight: 600; }
  @container (min-width: 460px) { .konto .konto-wide { display: table; } .konto .konto-grid { display: none; } }
  .datatab { border-collapse: collapse; width: 100%; margin: 12px 0; font-size: .86rem; white-space: normal; }
  .datatab th { border-bottom: 2px solid var(--ink); padding: 5px 6px; text-align: left; vertical-align: bottom; font-weight: 600; }
  .datatab th.n, .datatab td.n { text-align: right; }
  .datatab td { padding: 5px 6px; border-bottom: 1px solid var(--line); }
  @media (max-width: 560px) { .datatab { font-size: .74rem; } .datatab th, .datatab td { padding: 4px 2px; } .datatab th { hyphens: auto; -webkit-hyphens: auto; } }
  .konto-title { font-weight: 600; text-align: center; padding-bottom: 6px; }
  .konto-grid { display: flex; flex-wrap: wrap; gap: 10px 0; }
  .konto-side { border-collapse: collapse; flex: 1 1 230px; min-width: 0; }
  .konto-side.ha { margin-left: 0; }
  .konto-side th { border-bottom: 2px solid var(--ink); padding: 4px 6px; text-align: left; }
  .konto-side td { padding: 4px 6px; vertical-align: top; }
  .konto-side td.n { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .konto-side tr.sum td { border-top: 1px solid var(--ink); border-bottom: 3px double var(--ink); font-weight: 600; }
  @media (max-width: 560px) { .konto { font-size: .74rem; } .konto-side td, .konto-side th { padding: 3px 3px; } }

  .pct-opt { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; margin: 4px 0 8px; font-size: .88rem; }
  .pct-opt label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; font-weight: 600; }
  .pct-opt input { width: auto; }
  .sheet.nopct col.col-p, .sheet.nopct .c-p, .sheet.nopct th.hp { display: none; }
  .wrap { overflow-x: auto; }
  table.sheet { table-layout: fixed; width: var(--tw, 640px); border-collapse: collapse; }
  .sheet th { text-align: left; font-size: .72rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); padding: 4px 6px; }
  .sheet td { padding: 3px 4px; vertical-align: middle; }
  .sheet input, .sheet select { width: 100%; font: inherit; padding: 7px 8px; border: 1px solid var(--line); border-radius: 6px; background: #fff; color: var(--ink); }
  .sheet input:focus, .sheet select:focus { outline: 2px solid var(--accent); border-color: var(--accent); }
  .sheet input.amt, .sheet input.p1, .sheet input.p2 { text-align: right; font-variant-numeric: tabular-nums; }
  .c-vz { width: var(--w-vz, 78px); } .c-p { width: var(--w-p, 84px); } .c-amt { width: var(--w-amt, 140px); } .c-act { width: var(--w-act, 76px); white-space: nowrap; }
  .sheet select.vz-empty { color: #9aa5b5; }
  .sheet select.vz-empty option { color: var(--ink); }
  .sheet .ok { border-color: var(--ok); background: var(--ok-bg); }
  .sheet .bad { border-color: var(--bad); background: var(--bad-bg); }
  .sheet .follow { border-color: #c98a00; background: var(--follow-bg); }
  .sheet .neutral { border-color: #9aa5b5; background: var(--neutral-bg); }

  button.ico { border: 1px solid var(--line); background: var(--card); border-radius: 6px; padding: 5px 8px; cursor: pointer; font: inherit; font-size: .8rem; color: var(--muted); }
  button.ico:hover { color: var(--ink); border-color: var(--muted); }
  .bar-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
  .bar-actions.top { margin: 0 0 8px; }
  button.btn { font: inherit; padding: 9px 16px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; }
  button.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  button.btn.small { padding: 6px 12px; font-size: .88rem; }
  .spacer { flex: 1; }

  .result { display: none; }
  .result.show { display: block; }
  .score { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
  .score .big { font-size: 1.8rem; font-weight: 700; }
  .score .note { font-size: 1.05rem; color: var(--muted); }
  .meter { height: 10px; background: var(--line); border-radius: 6px; overflow: hidden; margin: 10px 0 14px; }
  .meter > div { height: 100%; background: var(--ok); width: 0; transition: width .4s; }
  table.res { width: 100%; border-collapse: collapse; font-size: .88rem; min-width: 700px; }
  .res th { text-align: left; font-size: .72rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); border-bottom: 2px solid var(--line); padding: 5px 6px; }
  .res td { padding: 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .res .t-ok { color: var(--ok); font-weight: 600; }
  .res .t-bad { color: var(--bad); font-weight: 600; }
  .res .t-follow { color: var(--follow); font-weight: 600; }
  .res .muted { color: var(--muted); }
  .res tr.missing td { background: var(--bad-bg); }
  .notes { margin: 12px 0 0; padding-left: 18px; font-size: .88rem; }
  .legend { color: var(--muted); font-size: .8rem; margin: 10px 0 0; }
  .overlay { position: fixed; inset: 0; background: rgba(20, 28, 40, .45); display: none; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
  .overlay.show { display: flex; }
  .dialog { background: var(--card); border-radius: 12px; padding: 20px 22px; max-width: 420px; width: 100%; box-shadow: 0 10px 40px rgba(0,0,0,.25); }
  .dialog p { margin: 0 0 16px; }
  .dialog .row { display: flex; justify-content: flex-end; gap: 10px; }

  /* Kennzahlen (Bruch) */
  .kz { padding: 14px 0; border-top: 1px solid var(--line); }
  .kz:first-child { border-top: 0; padding-top: 0; }
  .kz h3 { margin: 0 0 10px; font-size: 1rem; }
  .frac { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .frac .parts { display: flex; flex-direction: column; width: 300px; max-width: 100%; }
  .frac .parts .bar { border-top: 2px solid var(--ink); margin: 6px 0; }
  .frac .eq { font-size: 1.1rem; font-variant-numeric: tabular-nums; min-width: 130px; }
  .frac .eq .live { color: var(--muted); }
  .kz input { font: inherit; padding: 7px 8px; border: 1px solid var(--line); border-radius: 6px; background: #fff; color: var(--ink); width: 100%; }
  .kz input:focus { outline: 2px solid var(--accent); border-color: var(--accent); }
  .kz .parts input { text-align: center; }
  .kz .sent { margin-top: 12px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .kz .sent input { width: 120px; text-align: right; }
  .kz .sent .lbl { white-space: nowrap; }
  .kz .ok { border-color: var(--ok); background: var(--ok-bg); }
  .kz .bad { border-color: var(--bad); background: var(--bad-bg); }
  .kz .follow { border-color: #c98a00; background: var(--follow-bg); }
  .res-kz { margin-top: 16px; }
  .res-kz { container-type: inline-size; }
  .res-kz table.res { min-width: 0; }
  /* Kennzahlen (Zuschlag, Faktor, Spanne ...) immer untereinander als Karten, auch am Computer */
  @container (min-width: 0px) {
    .res-kz .res thead { display: none; }
    .res-kz .res tbody, .res-kz .res tr, .res-kz .res td { display: block; }
    .res-kz .res tr { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; margin-bottom: 8px; }
    .res-kz .res td { border: 0; padding: 2px 0; }
    .res-kz .res td::before { content: attr(data-l); display: inline-block; min-width: 80px; color: var(--muted); font-size: .76rem; }
    .res-kz .res td:first-child::before { display: none; }
    .res-kz .res td:first-child { font-size: .95rem; margin-bottom: 4px; }
  }
  .res-kz h4, .res-h { margin: 0 0 6px; font-size: .9rem; }
  .res-kz h4:not(:first-child) { margin-top: 16px; }
  .part-title { margin: 0 0 12px; font-size: 1.05rem; }
  .kz-sub { margin: 0 0 8px; font-size: .95rem; }
  .part-title + .kz { border-top: 0; padding-top: 0; }
  .parts-line { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: .88rem; color: var(--muted); margin: -4px 0 14px; }
  .parts-line .t-ok { color: var(--ok); font-weight: 600; }

  /* Taschenrechner */
  .calc { position: fixed; right: 16px; bottom: 16px; width: 270px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 10px 40px rgba(0,0,0,.25); padding: 12px; z-index: 40; display: none; }
  .calc.show { display: block; }
  .calc:focus { outline: none; }
  .calc .hist { min-height: 96px; max-height: 96px; overflow: hidden; font-size: .78rem; line-height: 1.3; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; margin-bottom: 4px; }
  .calc .hist div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .calc .disp { background: var(--bg); border-radius: 8px; padding: 10px 12px; text-align: right; font-size: 1.4rem; font-variant-numeric: tabular-nums; min-height: 46px; overflow: hidden; white-space: nowrap; margin-bottom: 10px; }
  .calc .keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .calc .keys button { font: inherit; font-size: 1.05rem; padding: 10px 0; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; }
  .calc .keys button:hover { background: var(--bg); }
  .calc .keys button.op { background: #eef2fa; }
  .calc .keys button.eq { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .calc .keys button.wide { grid-column: span 2; }
  @media (max-width: 560px) {
    .calc { width: 200px; right: 10px; bottom: 10px; padding: 8px; border-radius: 12px; }
    .calc .hist { min-height: 50px; max-height: 50px; font-size: .7rem; margin-bottom: 2px; }
    .calc .hist div:nth-child(n+4) { display: none; }
    .calc .disp { font-size: 1.1rem; min-height: 34px; padding: 6px 8px; margin-bottom: 6px; }
    .calc .keys { gap: 4px; }
    .calc .keys button { font-size: 1rem; padding: 8px 0; border-radius: 6px; line-height: 1.1; }
    .calc .disp { line-height: 1.2; }
  }
  /* Aufgabenkarte, Platzhalter, Handy-Ansicht */
  .sheet input::placeholder { color: transparent; }
  .task-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .task-head strong { font-size: .78rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }

  @media (max-width: 380px) { .kz .sent { font-size: .76rem; gap: 4px; } .kz .sent input { width: 70px !important; flex-basis: 70px !important; } }

  /* Computer: Aufgabentext links fest, Tabelle rechts */
  @media (min-width: 1000px) {
    main { max-width: 1600px; display: grid; grid-template-columns: clamp(330px, 28vw, 480px) minmax(0, 1fr); column-gap: 18px; align-items: start; }
    /* Regel: Enthält die Aufgabe eine Tabelle (z. B. Konto), wird die Aufgabenkarte breiter */
    main:has(.konto), main:has(.datatab) { grid-template-columns: 600px minmax(0, 1fr); }
    main > .tabs { grid-column: 1 / -1; grid-row: 1; }
    main > .task-card { grid-column: 1; grid-row: 2 / span 30; position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow: auto; }
    main > :not(.tabs):not(.task-card) { grid-column: 2; }
  }

  /* Handy: Tabelle zweireihig, Auswertung als Karten */
  @media (max-width: 560px) {
    header { padding: 12px 14px; }
    main { padding: 12px 10px 50px; }
    .card { padding: 12px; }
    .sheet input::placeholder { color: #9aa5b5; }
    table.sheet { width: 100% !important; table-layout: auto; }
    .sheet colgroup, .sheet thead { display: none; }
    .sheet tbody, .sheet tr, .sheet td { display: block; }
    .sheet td { padding: 0; width: auto !important; }
    .sheet tr { display: grid; grid-template-columns: 76px 1fr 100px 36px; grid-template-areas: "vz nm amt act" ". p1 p2 act"; gap: 4px; padding: 8px 0; border-bottom: 1px solid var(--line); }
    .sheet td.c-vz { grid-area: vz; } .sheet td.c-nm { grid-area: nm; } .sheet td.c-amt { grid-area: amt; }
    .sheet td.c-p1 { grid-area: p1; } .sheet td.c-p2 { grid-area: p2; }
    .sheet td.c-act { grid-area: act; display: flex; flex-direction: column; gap: 4px; }
    .sheet td.c-act button.ico { padding: 6px 0; text-align: center; }
    .sheet.nopct tr { grid-template-areas: "vz nm amt act"; }
    .sheet.nopct td.c-p { display: none; }
    .sheet td.c-p1 input, .sheet td.c-p2 input { padding: 5px 8px; font-size: .88rem; }
    .sheet select { padding-left: 6px; padding-right: 2px; }
    .kz .sent { flex-wrap: wrap; gap: 6px; font-size: .88rem; }
    .kz .sent input { width: 76px; flex: 0 0 76px; padding: 6px 8px; }
    table.res { min-width: 0; }
    .res thead { display: none; }
    .res tbody, .res tr, .res td { display: block; }
    .res tr { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; margin-bottom: 8px; }
    .res tr.missing { background: var(--bad-bg); }
    .res tr.missing td { background: transparent; }
    .res td { border: 0; padding: 2px 0; }
    .res td::before { content: attr(data-l); display: inline-block; min-width: 96px; color: var(--muted); font-size: .76rem; }
    .res td:first-child::before { display: none; }
    .res td:first-child { font-size: .95rem; margin-bottom: 4px; }
  }
  /* Auswertungstabelle: bei schmaler Fläche (nicht nur auf dem Handy) als Karten statt seitlich scrollen */
  #res-table-wrap { container-type: inline-size; }
  @container (max-width: 720px) {
    #res-table-wrap table.res { min-width: 0; }
    #res-table-wrap .res thead { display: none; }
    #res-table-wrap .res tbody, #res-table-wrap .res tr, #res-table-wrap .res td { display: block; }
    #res-table-wrap .res tr { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; margin-bottom: 8px; }
    #res-table-wrap .res tr.missing { background: var(--bad-bg); }
    #res-table-wrap .res tr.missing td { background: transparent; }
    #res-table-wrap .res td { border: 0; padding: 2px 0; }
    #res-table-wrap .res td::before { content: attr(data-l); display: inline-block; min-width: 96px; color: var(--muted); font-size: .76rem; }
    #res-table-wrap .res td:first-child::before { display: none; }
    #res-table-wrap .res td:first-child { font-size: .95rem; margin-bottom: 4px; }
  }
  /* sehr kleine Handys (ab 320 px) */
  @media (max-width: 400px) {
    header { padding: 12px; }
    header h1 { font-size: 1.05rem; min-width: 0; }
    header .calc-toggle { flex: 0 0 auto; padding: 6px 10px; font-size: .82rem; }
  }
  @media (max-width: 560px) { .kz .sent .lbl { white-space: normal; } }
</style>
</head>
<body>
<header>
  <h1>KSK Kalkulationstrainer</h1>
  <button class="calc-toggle" id="btn-calc" aria-pressed="false">Taschenrechner</button>
</header>

<main>
  <div class="tabs" id="tabs"></div>

  <div class="card task-card" id="task-card">
    <div class="task-head"><strong>Aufgabe</strong></div>
    <div class="task" id="task-text"></div>
    <div class="task-hint" id="task-hint"></div>
  </div>

  <div class="card" id="table-card">
    <h3 class="part-title" id="table-title"></h3>
    <div class="pct-opt"><label><input type="checkbox" id="pct-toggle" checked> Prozent-Hilfe anzeigen</label><span class="muted">Die Prozentspalten sind nur eine Hilfe und werden nicht bewertet.</span></div>
    <div class="bar-actions top"><button class="btn small" id="btn-top">+ Zeile ganz oben</button></div>
    <div class="wrap">
      <table class="sheet" id="sheet">
        <colgroup><col style="width:var(--w-vz,78px)"><col id="col-nm" style="width:110px"><col class="col-p" style="width:var(--w-p,84px)"><col class="col-p" style="width:var(--w-p,84px)"><col style="width:var(--w-amt,140px)"><col style="width:var(--w-act,84px)"></colgroup>
        <thead><tr><th>Vz</th><th>Bezeichnung</th><th class="hp">% (Hilfe)</th><th class="hp">% (Hilfe)</th><th>Betrag</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="bar-actions"><button class="btn small" id="btn-bottom">+ Zeile ganz unten</button></div>
  </div>

  <div id="kz-card" style="display:none"><div id="kz-list"></div></div>

  <div class="bar-actions" style="justify-content:flex-end; margin: 0 0 14px">
    <button class="btn" id="btn-reset">Neu beginnen</button>
    <button class="btn primary" id="btn-check">Fertig</button>
  </div>

  <div class="card result" id="result">
    <div class="score"><span class="big" id="score-big"></span><span class="note" id="score-note"></span></div>
    <div class="meter"><div id="score-bar"></div></div>
    <div class="parts-line" id="score-parts"></div>
    <h4 class="res-h" id="res-table-title"></h4>
    <div class="wrap" id="res-table-wrap"><table class="res"><thead><tr><th>Soll</th><th>Bezeichnung</th><th>Vz</th><th>Betrag</th><th>Reihenfolge</th><th>Prozent (nicht gewertet)</th></tr></thead><tbody id="res-rows"></tbody></table></div>
    <div class="res-kz wrap" id="res-kz"></div>
    <ul class="notes" id="res-notes"></ul>
    <p class="legend" id="legend"></p>
  </div>
</main>

<div class="calc" id="calc" tabindex="0" aria-label="Taschenrechner">
  <div class="hist" id="calc-hist"></div>
  <div class="disp" id="calc-disp">0</div>
  <div class="keys" id="calc-keys">
    <button data-k="C">C</button><button data-k="⌫">⌫</button><button data-k="%">%</button><button class="op" data-k="÷">÷</button>
    <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button><button class="op" data-k="×">×</button>
    <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button><button class="op" data-k="−">−</button>
    <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button><button class="op" data-k="+">+</button>
    <button data-k="(">(</button><button data-k="0">0</button><button data-k=",">,</button><button data-k=")">)</button>
    <button class="eq wide" data-k="=" style="grid-column: span 4">=</button>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="dialog" role="dialog" aria-modal="true">
    <p id="dlg-text"></p>
    <div class="row"><button class="btn" id="dlg-no">Abbrechen</button><button class="btn primary" id="dlg-yes">Ja</button></div>
  </div>
</div>

<script>
/* =====================================================================
   SCHEMA (Handelskalkulation, immer von oben nach unten)
   sign: '=' Start/Summe, '+' Zuschlag, '-' Abzug
   alias: erlaubte Schreibweisen (exakt, Groß-/Kleinschreibung zählt)
   ===================================================================== */
const SCHEMA = [
  { key: 'LEP',  sign: '=', alias: ['Listeneinkaufspreis', 'LEP'] },
  { key: 'LR',   sign: '-', alias: ['Lieferrabatt', 'Lieferantenrabatt', 'Liefererrabatt', 'LR', 'LRB'] },
  { key: 'ZEP',  sign: '=', alias: ['Zieleinkaufspreis', 'ZEP'] },
  { key: 'LS',   sign: '-', alias: ['Lieferskonto', 'Lieferantenskonto', 'Liefererskonto', 'LS', 'LSK'] },
  { key: 'BEP',  sign: '=', alias: ['Bareinkaufspreis', 'BEP'] },
  { key: 'BZK',  sign: '+', alias: ['Bezugskosten', 'BZK'] },
  { key: 'BP',   sign: '=', alias: ['Bezugspreis', 'Einstandspreis', 'BP', 'EP'] },
  { key: 'HK',   sign: '+', alias: ['Handlungskostenzuschlag', 'HKZ'] },
  { key: 'SKP',  sign: '=', alias: ['Selbstkostenpreis', 'SKP'] },
  { key: 'G',    sign: '+', alias: ['Gewinnzuschlag', 'GWZ'] },
  { key: 'BVP',  sign: '=', alias: ['Barverkaufspreis', 'BVP'] },
  { key: 'KS',   sign: '+', alias: ['Kundenskonto', 'KS', 'KSK'] },
  { key: 'VP',   sign: '+', alias: ['Vertreterprovision', 'VP'] },
  { key: 'ZVP',  sign: '=', alias: ['Zielverkaufspreis', 'ZVP'] },
  { key: 'KR',   sign: '+', alias: ['Kundenrabatt', 'KR', 'KRB'] },
  { key: 'LVP',  sign: '=', alias: ['Listenverkaufspreis', 'LVP'] }
];
const SCH = {}; const ALIAS = {}; const ORDER = SCHEMA.map(s => s.key);
SCHEMA.forEach(s => { SCH[s.key] = s; s.alias.forEach(a => { ALIAS[a] = s.key; }); });

let EXACT = false; // true = Rechnung ohne Zwischenrundung (nur für die Prüfung der Kennzahlen)
const r2 = x => EXACT ? x : Math.round((x + Number.EPSILON) * 100) / 100;

/* =====================================================================
   KENNZAHLEN (Bruch aus Zähler und Nenner + Satzfeld)
   u(k): Wert der Zeile k, b: Schlüssel des Verkaufspreises, den die Aufgabe nutzt
   (LVP, ZVP oder BVP). mult = 100 bei Prozent (das ×100 gehört in den Zähler).
   dec = Nachkommastellen im Ergebnis.
   ===================================================================== */
const KZ = {
  zuschlag: { title: 'Kalkulationszuschlag', sentence: 'Der Kalkulationszuschlag beträgt:', unit: '%', dec: 2, mult: 100,
              num: (u, b) => (u(b) - u('BP')) * 100, den: (u, b) => u('BP') },
  faktor:   { title: 'Kalkulationsfaktor',   sentence: 'Der Kalkulationsfaktor beträgt:',   unit: '',  dec: 4, mult: 1,
              num: (u, b) => u('LVP'), den: (u, b) => u('BP') },
  spanne:   { title: 'Handelsspanne',        sentence: 'Die Handelsspanne beträgt:',        unit: '%', dec: 2, mult: 100,
              num: (u, b) => (u(b) - u('BP')) * 100, den: (u, b) => u(b) },
  spannegv: { title: 'Handelsspanne',        sentence: 'Die durchschnittliche Handelsspanne beträgt:', unit: '%', dec: 2, mult: 100,
              num: (u, b) => (u('WV') - u('WE')) * 100, den: (u, b) => u('WV') },
  gewinn:   { title: 'Gewinn in Prozent',    sentence: 'Der Gewinn beträgt:',               unit: '%', dec: 2, mult: 100,
              num: (u, b) => (u('BVP') - u('SKP')) * 100, den: (u, b) => u('SKP') }
};

/* =====================================================================
   AUFGABEN
   steps: [Schlüssel, Rechenweg(u), optionale Alternativ-Rechenwege]
   kz: Liste der verlangten Kennzahlen, kzBase: genutzter Verkaufspreis
   noTable: true = Aufgabe ohne Kalkulationstabelle (nur Werte gegeben)
          u(k) liefert den Wert der Zeile k. Reihenfolge = Rechenreihenfolge.
   from/to: Bereich des Schemas, der verlangt wird. Das Schema ist IMMER vollständig: Jede Zeile muss da sein.
   Kommt eine Zeile in der Aufgabe nicht vor, bekommt sie in steps den Wert 0; richtig ist dann Betrag leer, 0, /, x oder -.
   (skip/merge werden nicht mehr verwendet.)
   pct: erwartete Prozente je Zeile als [Wert, Grundwert-Nr., 'r' (Satz/Ergebnis) | 'b' (neue 100 %)]
   ===================================================================== */
/* ---------- Rechenregeln (Weg A), zentral ----------
   Gewinn und Handlungskosten: Aufschlag auf die Zeile darüber.
   Rabatt, Skonto, Provision: Prozentsatz vom GRÖSSEREN Wert (ZEP, ZVP, LVP, LEP).
     - größerer Wert bekannt:   Prozent × Wert, abziehen
     - kleinerer Wert bekannt:  durch (1 − Prozentsatz) teilen
   Bezugskosten: fester Eurobetrag. ---------- */
const pc = (x, p) => r2(x * p / 100);
const up = (x, p) => r2(x / (1 - p / 100));

// Einkauf vorwärts: LEP → BEP (→ BZK → BP)
function einkaufVor(c) {
  const s = [['LEP', u => c.lep], ['LR', u => pc(u('LEP'), c.lr)], ['ZEP', u => r2(u('LEP') - u('LR'))],
             ['LS', u => pc(u('ZEP'), c.ls)], ['BEP', u => r2(u('ZEP') - u('LS'))]];
  if (c.bzk != null) s.push(['BZK', u => c.bzk], ['BP', u => r2(u('BEP') + u('BZK'))]);
  return s;
}
// Handlungskosten und Gewinn vorwärts: Basis → SKP (→ G → BVP)
function hkVor(c, base) {
  const s = [['HK', u => pc(u(base), c.hk)], ['SKP', u => r2(u(base) + u('HK'))]];
  if (c.g != null) s.push(['G', u => pc(u('SKP'), c.g)], ['BVP', u => r2(u('SKP') + u('G'))]);
  return s;
}
// Verkaufsseite vorwärts: BVP → LVP
function verkaufVor(c) {
  const sk = (c.ks || 0) + (c.vp || 0);
  const s = [['ZVP', u => up(u('BVP'), sk)]];
  if (c.ks) s.push(['KS', u => pc(u('ZVP'), c.ks)]);
  if (c.vp) s.push(['VP', u => pc(u('ZVP'), c.vp)]);
  s.push(['LVP', u => up(u('ZVP'), c.kr)], ['KR', u => pc(u('LVP'), c.kr)]);
  return s;
}
// Verkaufsseite rückwärts: LVP gegeben → BVP
function verkaufRueck(c) {
  const s = [['KR', u => pc(u('LVP'), c.kr)], ['ZVP', u => r2(u('LVP') - u('KR'))]];
  if (c.ks) s.push(['KS', u => pc(u('ZVP'), c.ks)]);
  if (c.vp) s.push(['VP', u => pc(u('ZVP'), c.vp)]);
  s.push(['BVP', u => r2(u('ZVP') - (u('KS') || 0) - (u('VP') || 0))]);
  return s;
}
// Prozent-Hilfe (nicht gewertet) aus den Sätzen der Aufgabe
function mkPct(c) {
  const p = {};
  if (c.lr != null) {
    p.LEP = [[100, 0, 'r']]; p.LR = [[c.lr, 0, 'r']]; p.ZEP = [[100 - c.lr, 0, 'r'], [100, 1, 'b']];
    p.LS = [[c.ls, 1, 'r']]; p.BEP = [[100 - c.ls, 1, 'r']];
    if (c.bzk != null) { p.BZK = []; p.BP = [[100, 2, 'b']]; } else if (c.hk != null) p.BEP.push([100, 2, 'b']);
  } else p.BP = [[100, 2, 'b']];
  if (c.hk != null) {
    p.HK = [[c.hk, 2, 'r']]; p.SKP = [[100 + c.hk, 2, 'r'], [100, 3, 'b']];
    p.G = c.g != null ? [[c.g, 3, 'r']] : [];
    p.BVP = c.g != null ? [[100 + c.g, 3, 'r']] : [];
  }
  const sk = (c.ks || 0) + (c.vp || 0);
  if (sk) {
    p.ZVP = [[100, 5, 'b']]; p.BVP = (p.BVP || []).concat([[100 - sk, 5, 'r']]);
    if (c.ks) p.KS = [[c.ks, 5, 'r']];
    if (c.vp) p.VP = [[c.vp, 5, 'r']];
    if (c.kr) { p.ZVP.push([100 - c.kr, 6, 'r']); p.KR = [[c.kr, 6, 'r']]; p.LVP = [[100, 6, 'b']]; }
  }
  return p;
}

// Einkauf rückwärts: BP gegeben → LEP
function einkaufRueck(c) {
  const s = [];
  if (c.bzk != null) s.push(['BZK', u => c.bzk], ['BEP', u => r2(u('BP') - u('BZK'))]);
  s.push(['ZEP', u => up(u('BEP'), c.ls)], ['LS', u => r2(u('ZEP') - u('BEP'))],
         ['LEP', u => up(u('ZEP'), c.lr)], ['LR', u => r2(u('LEP') - u('ZEP'))]);
  return s;
}

/* Name des Unternehmens in allen Aufgaben: hier zentral ändern */
const FIRMA = 'Kainzbach & Co. KG';

const C1 = { lep: 800, lr: 10, ls: 2, bzk: 40, hk: 30, g: 10, ks: 2, vp: 4, kr: 12 };
const C2 = { lr: 12, ls: 2, bzk: 30, hk: 25, g: 8, ks: 2, vp: 3, kr: 10 };
const C3 = { lep: 1200, lr: 10, ls: 2, bzk: 0, hk: 45, ks: 2, kr: 12 };

const TASKS = [
  {
    id: 's1', title: 'Vorwärtskalkulation', from: 'LEP', to: 'LVP',
    text: 'Die {{firma}} bezieht Bremsscheiben zu einem Listeneinkaufspreis von 800,00 € je Satz. Der Lieferant gewährt 10 % Liefererrabatt und 2 % Liefererskonto, die Bezugskosten betragen 40,00 € je Satz.\n\nBei der Preisgestaltung rechnet das Unternehmen mit einem Handlungskostenzuschlag von 30 % und einem Gewinnzuschlag von 10 %. Den Kunden werden 2 % Kundenskonto, 4 % Vertreterprovision und 12 % Kundenrabatt eingeräumt.\n\na) Ermitteln Sie unter Angabe des Kalkulationsschemas den Listenverkaufspreis (netto) für einen Satz Bremsscheiben.\n\nb) Ermitteln Sie auf der Grundlage der Ergebnisse aus a) den Kalkulationszuschlag, den Kalkulationsfaktor und die Handelsspanne.',
    parts: [
      { label: 'a)', title: 'Listenverkaufspreis', table: true },
      { label: 'b)', title: 'Kalkulationszuschlag, Kalkulationsfaktor und Handelsspanne', kz: ['zuschlag', 'faktor', 'spanne'] }
    ],
    kzBase: 'LVP',
    steps: [].concat(einkaufVor(C1), hkVor(C1, 'BP'), verkaufVor(C1)),
    pct: mkPct(C1)
  },
  {
    id: 's2', title: 'Rückwärtskalkulation', from: 'LEP', to: 'LVP',
    text: 'Die {{firma}} möchte Stoßdämpfer in ihr Sortiment aufnehmen. Am Markt lässt sich ein Listenverkaufspreis von 640,00 € je Satz durchsetzen.\n\nBei der Preisgestaltung rechnet das Unternehmen mit 10 % Kundenrabatt, 2 % Kundenskonto, 3 % Vertreterprovision, einem Handlungskostenzuschlag von 25 % und einem Gewinnzuschlag von 8 %. Der Lieferant gewährt 12 % Liefererrabatt und 2 % Liefererskonto, die Bezugskosten betragen 30,00 € je Satz.\n\na) Ermitteln Sie unter Angabe des Kalkulationsschemas den höchsten Listeneinkaufspreis, zu dem das Unternehmen die Stoßdämpfer einkaufen kann.\n\nb) Ermitteln Sie auf der Grundlage der Ergebnisse aus a) den Kalkulationszuschlag, den Kalkulationsfaktor und die Handelsspanne.',
    parts: [
      { label: 'a)', title: 'Höchstens möglicher Listeneinkaufspreis', table: true },
      { label: 'b)', title: 'Kalkulationszuschlag, Kalkulationsfaktor und Handelsspanne', kz: ['zuschlag', 'faktor', 'spanne'] }
    ],
    kzBase: 'LVP',
    steps: [].concat([['LVP', u => 640]], verkaufRueck(C2),
      [['SKP', u => up(u('BVP'), -C2.g)], ['G', u => r2(u('BVP') - u('SKP'))], ['BP', u => up(u('SKP'), -C2.hk)], ['HK', u => r2(u('SKP') - u('BP'))]],
      einkaufRueck(C2)),
    pct: mkPct(C2)
  },
  {
    id: 's3', title: 'Gewinn in Euro und Prozent', from: 'LEP', to: 'LVP',
    text: 'Die {{firma}} bezieht Reifensätze zu einem Listeneinkaufspreis von 1.200,00 € je Satz. Der Lieferant gewährt 10 % Liefererrabatt und 2 % Liefererskonto. Der Handlungskostenzuschlag beträgt 45 %.\n\nDie Reifensätze sollen den Kunden zu einem Listenverkaufspreis von 2.000,00 € je Satz angeboten werden. Dabei werden 12 % Kundenrabatt und 2 % Kundenskonto gewährt.\n\na) Ermitteln Sie unter Angabe des Kalkulationsschemas den Gewinn in Euro.\n\nb) Ermitteln Sie den Gewinn in Prozent.',
    parts: [
      { label: 'a)', title: 'Gewinn in Euro', table: true },
      { label: 'b)', title: 'Gewinn in Prozent', kz: ['gewinn'] }
    ],
    kzBase: 'LVP',
    steps: [].concat(einkaufVor(C3), hkVor(C3, 'BP'), [['LVP', u => 2000]],
      verkaufRueck(C3), [['VP', u => 0], ['G', u => r2(u('BVP') - u('SKP'))]]),
    pct: mkPct(C3)
  },
  {
    id: 's4', title: 'Handelsspanne', from: 'BP', to: 'BVP', noTable: true,
    text: 'Die {{firma}} hat für das erste Quartal die Daten eines Artikels aus ihrem Warenwirtschaftssystem ausgelesen:{{tabelle}}Berechnen Sie die Handelsspanne für die Bremsbeläge in Prozent.',
    tabelle: { head: ['Art.-Nr.', 'Bezugs\u00ADpreis je Stück', 'Barverkaufs\u00ADpreis je Stück', 'Menge eingekauft', 'Menge verkauft'], rows: [['BB2210', '52,00 €', '92,50 €', '40', '36']] },
    parts: [{ label: '', title: 'Handelsspanne', kz: ['spanne'] }],
    kzBase: 'BVP',
    steps: [['BP', u => 52], ['BVP', u => 92.5]],
    pct: {}
  },
  {
    id: 's5', title: 'Allgemeine Handelsspanne', from: 'BP', to: 'BVP', noTable: true,
    text: 'Die Buchhaltung der {{firma}} hat zum Jahresende das unten abgebildete Gewinn- und Verlustkonto abgeschlossen.{{konto}}Berechnen Sie daraus die durchschnittliche Handelsspanne in Prozent.',
    konto: { title: 'Gewinn- und Verlustkonto (930) der {{firma}}',
      soll: [['301 Wareneingang', 2900000], ['402 Gehälter', 640000], ['404 Sozialabgaben', 130000], ['430 Energie und Betriebsstoffe', 38000], ['481 Bürobedarf', 70000], ['491 Abschreibungen', 150000], ['Saldo', 272000]],
      haben: [['801 Warenverkauf', 4200000]] },
    parts: [{ label: '', title: 'Durchschnittliche Handelsspanne', kz: ['spannegv'] }],
    steps: [['WV', u => 4200000], ['WE', u => 2900000]],
    pct: {}
  }
];
TASKS.forEach(t => { t.text = t.text.split('{{firma}}').join(FIRMA); if (t.konto) t.konto.title = t.konto.title.split('{{firma}}').join(FIRMA); });


/* =====================================================================
   Hilfsfunktionen
   ===================================================================== */
const TOL = 0.02; // erlaubte Abweichung in Euro (überall)
// Alte, nicht mehr ganz richtige Bezeichnungen: zählen, geben aber gelb und 1 Punkt Abzug
const WEAK = { 'Handlungskosten': 'HK', 'HK': 'HK', 'Gewinn': 'G', 'G': 'G' };
const STORE_KEY = 'ksk-lernapp-best';
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const normSign = s => (s === '' || s == null) ? '=' : s;
const signLabel = s => s === '-' ? '−' : s;

function parseNum(s) {
  if (s == null) return NaN;
  s = String(s).trim().replace(/[\s€%]/g, '').replace('−', '-');
  if (!s) return NaN;
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
  return /^-?\d+(\.\d+)?$/.test(s) ? parseFloat(s) : NaN;
}
function fmt(v) { return v.toLocaleString('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €'; }
function fmtPct(v) { return v.toLocaleString('de-DE', { maximumFractionDigits: 2 }); }
function fmtDec(v, dec) { return v.toLocaleString('de-DE', { minimumFractionDigits: dec, maximumFractionDigits: dec }); }
function fmtMax(v, dec) { return v.toLocaleString('de-DE', { maximumFractionDigits: dec }); }

// Rechnet eine Eingabe aus: Zahl oder einfache Rechnung wie (73,75-40,50)*100. Gibt null zurück, wenn ungültig.
function evalExpr(s) {
  if (s == null) return null;
  s = String(s).trim();
  if (!s) return null;
  s = s.replace(/−/g, '-').replace(/[×xX]/g, '*').replace(/[÷:]/g, '/').replace(/%/g, '/100').replace(/\s+/g, '');
  let bad = false;
  s = s.replace(/\d[\d.,]*/g, t => { const n = parseNum(t); if (isNaN(n)) bad = true; return '(' + n + ')'; });
  if (bad || !/^[\d.+\-*/()]+$/.test(s)) return null;
  try {
    const v = Function('"use strict"; return (' + s + ');')();
    return typeof v === 'number' && isFinite(v) ? v : null;
  } catch (e) { return null; }
}
function grade(p) {
  if (p >= 92) return 'Note 1 (sehr gut)';
  if (p >= 81) return 'Note 2 (gut)';
  if (p >= 67) return 'Note 3 (befriedigend)';
  if (p >= 50) return 'Note 4 (ausreichend)';
  if (p >= 30) return 'Note 5 (mangelhaft)';
  return 'Note 6 (ungenügend)';
}
function truthExact(task) { EXACT = true; try { return truth(task); } finally { EXACT = false; } }
function truth(task) {
  const t = {}; const u = k => t[k];
  task.steps.forEach(s => { t[s[0]] = s[1](u); });
  return t;
}
function followVals(task, key, userVals, tr) {
  const u = k => (userVals[k] != null && !isNaN(userVals[k])) ? userVals[k] : tr[k];
  const step = task.steps.find(s => s[0] === key);
  return [step[1]].concat(step[2] || []).map(f => f(u));
}
const partTitle = p => ((p.label ? p.label + ' ' : '') + (p.title || '')).trim();
// Teilaufgaben ableiten, falls eine Aufgabe keine eigenen hat
function normTask(t) {
  if (!t.parts) t.parts = [].concat(t.noTable ? [] : [{ table: true }], (t.kz && t.kz.length) ? [{ kz: t.kz }] : []);
  t.kz = t.parts.reduce((a, p) => a.concat(p.kz || []), []);
  return t;
}
function rangeKeys(task) {
  return ORDER.slice(ORDER.indexOf(task.from), ORDER.indexOf(task.to) + 1).filter(k => !(task.skip || []).includes(k));
}
function placement(nums, variant) {
  const out = [null, null];
  nums.forEach(([v, base, role]) => {
    let col = variant === 'basis' ? base % 2 : (role === 'b' ? 1 : 0);
    if (out[col] != null) col = 1 - col;
    out[col] = v;
  });
  return out;
}

/* =====================================================================
   Zustand
   ===================================================================== */
let cur = 0, uid = 0, best = {};
const rowsByTask = {}; const lastScore = {}; const kzState = {};
function getKz(taskId, id) {
  if (!kzState[taskId]) kzState[taskId] = {};
  if (!kzState[taskId][id]) kzState[taskId][id] = { z: '', n: '', s: '', st: null };
  return kzState[taskId][id];
}
function liveText(s) {
  const z = evalExpr(s.z), n = evalExpr(s.n);
  return (z != null && n != null && n !== 0) ? fmtMax(z / n, 5) : '–';
}
try { best = JSON.parse(localStorage.getItem(STORE_KEY) || '{}'); } catch (e) { best = {}; }
function saveBest() { try { localStorage.setItem(STORE_KEY, JSON.stringify(best)); } catch (e) {} }
const newRow = () => ({ id: ++uid, sign: '', name: '', p1: '', p2: '', amt: '', st: null });
function getRows() {
  const id = TASKS[cur].id;
  if (!rowsByTask[id]) rowsByTask[id] = [newRow(), newRow(), newRow()];
  return rowsByTask[id];
}

/* =====================================================================
   Darstellung
   ===================================================================== */
// Rundungshinweis automatisch aus den verlangten Kennzahlen
// Zahl und Einheit (%, €) dürfen nicht durch einen Zeilenumbruch getrennt werden
const nb = str => String(str).replace(/(\d) (%|€)/g, '$1\u00A0$2');
function roundingHint(t) {
  const by = {};
  (t.kz || []).forEach(id => { const d = KZ[id]; (by[d.dec] = by[d.dec] || []).push(d.title); });
  const part = Object.keys(by).sort((a, b) => a - b).map(dec => {
    const names = by[dec]; const list = names.length > 1 ? names.slice(0, -1).join(', ') + ' und ' + names[names.length - 1] : names[0];
    return list + ' auf ' + dec + ' Nachkommastellen';
  });
  return part.length ? 'Rundung: ' + part.join(', ') + '.' : '';
}
// Allgemeine Datentabelle in der Aufgabe: { head: [...], rows: [[...], ...] }; erste Spalte links, weitere rechtsbündig
function dataTableHtml(d) {
  const th = d.head.map((h, i) => `<th${i ? ' class="n"' : ''}>${esc(nb(h))}</th>`).join('');
  const tr = d.rows.map(r => '<tr>' + r.map((c, i) => `<td${i ? ' class="n"' : ''}>${esc(nb(c))}</td>`).join('') + '</tr>').join('');
  return `<table class="datatab"><thead><tr>${th}</tr></thead><tbody>${tr}</tbody></table>`;
}
function kontoHtml(k) {
  const f = v => v.toLocaleString('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const n = Math.max(k.soll.length, k.haben.length);
  const sum = k.haben.reduce((x, y) => x + y[1], 0);
  const side = (name, list, cls) => {
    let rows = '';
    list.forEach(a => { rows += `<tr><td>${esc(a[0])}</td><td class="n">${f(a[1])}</td></tr>`; });
    rows += `<tr class="sum"><td></td><td class="n">${f(sum)}</td></tr>`;
    return `<table class="konto-side ${cls}"><thead><tr><th colspan="2">${name}</th></tr></thead><tbody>${rows}</tbody></table>`;
  };
  // Breite Ansicht: eine Tabelle mit 4 Spalten, Zeilen von Soll und Haben liegen immer auf gleicher Höhe
  let wr = '';
  for (let i = 0; i < n; i++) {
    const a = k.soll[i], b = k.haben[i];
    wr += `<tr><td class="lb">${a ? esc(a[0]) : ''}</td><td class="n">${a ? f(a[1]) : ''}</td><td class="lb hv">${b ? esc(b[0]) : ''}</td><td class="n">${b ? f(b[1]) : ''}</td></tr>`;
  }

/* =====================================================================
   Auswertung
   ===================================================================== */
function evaluate(task) {
  normTask(task);
  const tr = truth(task); const trE = truthExact(task);
  const keys = task.noTable ? [] : rangeKeys(task);
  const rows = task.noTable ? [] : getRows();
  rows.forEach(r => { r.st = null; r._weak = false; });
  const used = rows.filter(r => r.name.trim() || r.amt.trim() || r.p1.trim() || r.p2.trim());
  const found = {}, order = [], notes = [];

  used.forEach(r => {
    const nm = r.name.trim(); let key = nm ? ALIAS[nm] : null;
    if (!key && nm && WEAK[nm]) { key = WEAK[nm]; r._weak = true; }
    if (key && !keys.includes(key) && task.merge && task.merge[key]) key = task.merge[key];
    const line = rows.indexOf(r) + 1;
    if (!key) { r.st = { name: 'bad' }; notes.push(`Zeile ${line}: Bezeichnung „${esc(nm || 'leer')}“ nicht erkannt. Prüfen Sie die Schreibweise (Groß-/Kleinschreibung zählt).`); return; }
    if (!keys.includes(key)) { r.st = { name: 'neutral' }; notes.push(`Zeile ${line}: „${esc(nm)}“ gehört nicht zu dieser Aufgabe und wird nicht gewertet.`); return; }
    if (found[key]) { r.st = { name: 'neutral' }; notes.push(`Zeile ${line}: „${esc(nm)}“ steht doppelt, nur die erste Zeile wird gewertet.`); return; }
    found[key] = r; order.push(key);
  });

  const uv = {};
  keys.forEach(k => { if (found[k]) { const v = parseNum(found[k].amt); if (!isNaN(v)) uv[k] = Math.abs(v); } });

  let prev = -1; const posOk = {};
  // Kundenskonto und Verkaufsprovision dürfen in beliebiger Reihenfolge stehen (gleicher Rang)
  const rank = k => keys.indexOf((k === 'VP' && keys.includes('KS')) ? 'KS' : k);
  // Beide Richtungen sind richtig: von oben nach unten (LEP → LVP) oder von unten nach oben (LVP → LEP)
  const dirOk = dir => { const res = {}; let pv = dir > 0 ? -1 : Infinity; order.forEach(k => { const i = rank(k); if (dir > 0 ? i >= pv : i <= pv) { res[k] = true; pv = i; } else res[k] = false; }); return res; };
  const up_ = dirOk(1), down_ = dirOk(-1);
  const cnt = o => order.filter(k => o[k]).length;
  const reversed = cnt(down_) > cnt(up_);
  Object.assign(posOk, reversed ? down_ : up_);
  if (reversed) notes.push('Ihr Schema steht von unten nach oben. Das gilt als richtig, die Vorzeichen sind dann umgekehrt (+ und −).');

  // Spaltenvariante für die Prozent-Hilfe erkennen
  const score = { basis: 0, satz: 0 };
  keys.forEach(k => {
    const r = found[k]; if (!r) return;
    const nums = task.pct[k] || [];
    ['basis', 'satz'].forEach(v => {
      const p = placement(nums, v);
      [r.p1, r.p2].forEach((txt, i) => { const n = parseNum(txt); if (!isNaN(n) && p[i] === n) score[v]++; });
    });
  });
  const variant = score.satz > score.basis ? 'satz' : 'basis';

  // Von unten nach oben gerechnet: Vorzeichen sind umgekehrt (+ ↔ −), „=“ bleibt
  const expSign = k => { const g = SCH[k].sign; return reversed ? (g === '+' ? '-' : g === '-' ? '+' : g) : g; };
  let pts = 0; const items = [];
  keys.forEach(k => {
    const r = found[k]; const it = { key: k, tv: tr[k], sg: expSign(k) };
    if (!r) { it.missing = true; items.push(it); return; }
    const st = { name: r._weak ? 'follow' : 'ok' }; it.weak = !!r._weak; it.userName = r.name.trim();
    it.signOk = normSign(r.sign) === normSign(it.sg);
    st.sign = it.signOk ? 'ok' : 'bad';
    const v = parseNum(r.amt);
    it.userAmt = v; it.userSign = r.sign;
    // Kommt eine Zeile in der Aufgabe nicht vor (Sollwert 0): leer, 0, /, x oder - ist richtig
    const rawAmt = r.amt.trim();
    const zeroOk = tr[k] === 0 && /^(0+([.,]0+)?|\/|x|X|-|–|—)?$/.test(rawAmt);
    if (zeroOk || (!isNaN(v) && Math.abs(Math.abs(v) - tr[k]) <= TOL + 1e-9)) it.amt = 'ok';
    else if (!isNaN(v) && followVals(task, k, uv, tr).some(f => Math.abs(Math.abs(v) - f) <= TOL + 1e-9)) it.amt = 'follow';
    else it.amt = isNaN(v) ? 'empty' : 'bad';
    st.amt = it.amt === 'ok' ? 'ok' : it.amt === 'follow' ? 'follow' : 'bad';
    it.posOk = posOk[k];
    // Prozent (nicht gewertet)
    const exp = (task.pct[k] || []);
    const expNums = exp.map(e => e[0]).sort((a, b) => a - b);
    const userNums = [parseNum(r.p1), parseNum(r.p2)].filter(n => !isNaN(n)).sort((a, b) => a - b);
    const ep = placement(exp, variant);
    it.pctExp = exp.length ? `${ep[0] != null ? fmtPct(ep[0]) : '–'} | ${ep[1] != null ? fmtPct(ep[1]) : '–'}` : '';
    if (!exp.length && !userNums.length) it.pct = 'none';
    else if (!userNums.length) it.pct = 'empty';
    else if (JSON.stringify(expNums) === JSON.stringify(userNums)) it.pct = 'ok';
    else it.pct = 'diff';
    pts += (it.weak ? 0 : 1) + (it.signOk ? 1 : 0) + (it.amt === 'ok' || it.amt === 'follow' ? 1 : 0) + (it.posOk ? 1 : 0);
    r.st = st; items.push(it);
  });

  // Kennzahlen (Bruch + Satzfeld)
  const tablePts = pts;
  const kzItems = []; const kzPts = {};
  (task.kz || []).forEach(id => {
    const d = KZ[id]; const s = getKz(task.id, id); const base = task.kzBase || 'LVP';
    const T = k => tr[k];
    const U = k => (uv[k] != null) ? uv[k] : tr[k];
    const zE = d.num(k => trE[k], base), nE = d.den(k => trE[k], base);
    const zT = d.num(T, base), nT = d.den(T, base), zU = d.num(U, base), nU = d.den(U, base);
    const zv = evalExpr(s.z), nv = evalExpr(s.n), sv = parseNum(s.s);
    const close = (a, b, t) => a != null && !isNaN(a) && Math.abs(a - b) <= t + 1e-9;
    const rd = x => Math.round(x * Math.pow(10, d.dec)) / Math.pow(10, d.dec);
    const same = (a, b) => !isNaN(a) && Math.abs(rd(a) - b) < 1e-9;
    const tolZ = TOL * d.mult;
    const zst = zv == null ? 'empty' : close(zv, zT, tolZ) ? 'ok' : close(zv, zU, tolZ) ? 'follow' : 'bad';
    const nst = nv == null ? 'empty' : close(nv, nT, TOL) ? 'ok' : close(nv, nU, TOL) ? 'follow' : 'bad';
    const r5 = x => Math.round(x * 1e5) / 1e5;
    const anySame = (a, x) => same(a, rd(x)) || same(a, rd(r5(x)));
    const expT = rd(zT / nT);
    const sst = isNaN(sv) ? 'empty'
      : (anySame(sv, zT / nT) || anySame(sv, zE / nE)) ? 'ok'
      : (anySame(sv, zU / nU) || (zv != null && nv != null && nv !== 0 && anySame(sv, zv / nv))) ? 'follow' : 'bad';
    const hint = (zst === 'bad' && d.mult === 100 && zv != null && close(zv * 100, zT, tolZ))
      ? 'Das ×100 fehlt im Zähler.' : '';
    const good = x => (x === 'ok' || x === 'follow') ? 1 : 0;
    const kp = good(zst) + good(nst) + good(sst); kzPts[id] = kp; pts += kp;
    s.st = { z: zst === 'empty' ? 'bad' : zst, n: nst === 'empty' ? 'bad' : nst, s: sst === 'empty' ? 'bad' : sst };
    kzItems.push({ id, d, zst, nst, sst, zT, nT, expT, zv, nv, sv, hint });
  });

  const max = keys.length * 4 + (task.kz || []).length * 3;
  const parts = task.parts.map(p => ({ title: partTitle(p), pts: p.table ? tablePts : p.kz.reduce((a, id) => a + (kzPts[id] || 0), 0), max: p.table ? keys.length * 4 : p.kz.length * 3 }));
  return { pts, max, pct: Math.round(pts / max * 100), items, kzItems, parts, notes, variant };
}

function buildKzHtml(kzItems, task) {
  if (!kzItems.length) return '';
  const cell = (st, ok, got, exp, extra) => {
    if (st === 'ok') return `<span class="t-ok">✓</span> ${exp}`;
    if (st === 'follow') return `<span class="t-follow">folgerichtig ✓</span> <span class="muted">(Lösung: ${exp})</span>`;
    if (st === 'empty') return `<span class="t-bad">✗ leer</span> <span class="muted">(richtig: ${exp})</span>`;
    return `<span class="t-bad">✗</span> <span class="muted">(Ihr Wert: ${got}, richtig: ${exp})</span>${extra ? ' <span class="t-bad">' + extra + '</span>' : ''}`;
  };
  const rowOf = k => {
    const d = k.d;
    const z = cell(k.zst, null, k.zv != null ? fmtMax(k.zv, 4) : '', fmtMax(k.zT, 4), k.hint);
    const n = cell(k.nst, null, k.nv != null ? fmtMax(k.nv, 4) : '', fmtMax(k.nT, 4));
    const e = cell(k.sst, null, isNaN(k.sv) ? '' : fmtMax(k.sv, 6), fmtDec(k.expT, d.dec) + (d.unit ? ' ' + d.unit : ''));
    return `<tr><td><strong>${esc(d.title)}</strong></td><td data-l="Zähler">${z}</td><td data-l="Nenner">${n}</td><td data-l="Ergebnis">${e}</td></tr>`;
  };
  return task.parts.filter(p => p.kz && p.kz.length).map(p => {
    const items = kzItems.filter(k => p.kz.includes(k.id));
    return `<h4>${esc(partTitle(p) || 'Kennzahlen')}</h4><table class="res"><thead><tr><th>Kennzahl</th><th>Zähler</th><th>Nenner</th><th>Ergebnis</th></tr></thead><tbody>${items.map(rowOf).join('')}</tbody></table>`;
  }).join('');
}

function buildRowsHtml(items) {
  return items.map(it => {
    const sc = Object.assign({}, SCH[it.key], { sign: it.sg || SCH[it.key].sign });
    const soll = `<strong>${esc(signLabel(sc.sign) === '=' ? '=' : signLabel(sc.sign))}</strong> ${esc(sc.alias[0])}<br><span class="muted">${esc(sc.alias.slice(1).join(' / '))}</span>`;
    if (it.missing) return `<tr class="missing"><td>${soll}</td><td class="t-bad" data-l="Bezeichnung">Zeile fehlt</td><td data-l="Vz"><strong class="t-bad">${esc(signLabel(sc.sign))}</strong></td><td data-l="Betrag"><span class="t-bad">richtig:</span> ${fmt(it.tv)}</td><td data-l="Reihenfolge">–</td><td data-l="Prozent">–</td></tr>`;
    const signCell = it.signOk ? '<span class="t-ok">✓</span>' : `<span class="t-bad">✗</span> <span class="muted">(Ihr Wert: ${it.userSign === '' ? 'leer' : esc(signLabel(it.userSign))}, richtig: ${esc(signLabel(sc.sign))})</span>`;
    let amtCell;
    if (it.amt === 'ok') amtCell = `<span class="t-ok">✓</span> ${fmt(it.tv)}`;
    else if (it.amt === 'follow') amtCell = `<span class="t-follow">folgerichtig ✓</span> <span class="muted">(Lösung: ${fmt(it.tv)})</span>`;
    else if (it.amt === 'empty') amtCell = `<span class="t-bad">✗ leer</span> <span class="muted">(richtig: ${fmt(it.tv)})</span>`;
    else amtCell = `<span class="t-bad">✗</span> <span class="muted">(Ihr Wert: ${fmt(it.userAmt)}, richtig: ${fmt(it.tv)})</span>`;
    const posCell = it.posOk ? '<span class="t-ok">✓</span>' : '<span class="t-bad">✗</span> <span class="muted">(steht an der falschen Stelle)</span>';
    let pctCell;
    if (it.pct === 'ok') pctCell = '<span class="t-ok">✓</span>';
    else if (it.pct === 'none') pctCell = '<span class="muted">–</span>';
    else pctCell = `<span class="muted">${it.pct === 'empty' ? 'leer' : 'abweichend'}, erwartet: ${esc(it.pctExp || 'keine')}</span>`;
    return `<tr><td>${soll}</td><td data-l="Bezeichnung">${it.weak ? `<span class="t-follow">gelb</span> <span class="muted">(„${esc(it.userName)}“ ist nicht falsch, richtig ist: ${esc(sc.alias[0])}, 1 Punkt Abzug)</span>` : '<span class="t-ok">✓</span>'}</td><td data-l="Vorzeichen">${signCell}</td><td data-l="Betrag">${amtCell}</td><td data-l="Reihenfolge">${posCell}</td><td data-l="Prozent">${pctCell}</td></tr>`;
  }).join('');
}

// Eigenes Bestätigungsfenster (window.confirm wird in Vorschaufenstern oft blockiert)
function ask(msg, yes) {
  return new Promise(resolve => {
    $('dlg-text').textContent = msg;
    $('dlg-yes').textContent = yes || 'Ja';
    $('overlay').classList.add('show');
    $('dlg-yes').focus();
    const done = v => {
      $('overlay').classList.remove('show');
      $('dlg-yes').onclick = $('dlg-no').onclick = null;
      resolve(v);
    };
    $('dlg-yes').onclick = () => done(true);
    $('dlg-no').onclick = () => done(false);
  });
}

async function check() {
  const task = TASKS[cur];
  const tableUsed = task.noTable ? [] : getRows().filter(r => r.name.trim() || r.amt.trim());
  const kzUsed = (task.kz || []).filter(id => { const s = getKz(task.id, id); return s.z.trim() || s.n.trim() || s.s.trim(); });
  const msg = (tableUsed.length === 0 && kzUsed.length === 0)
    ? 'Es ist noch nichts eingetragen. Trotzdem abgeben?'
    : 'Aufgabe jetzt abgeben und auswerten lassen?';
  if (!(await ask(msg, 'Abgeben'))) return;
  const res = evaluate(task);
  res.rowsHtml = buildRowsHtml(res.items);
  res.kzHtml = buildKzHtml(res.kzItems, task);
  res.notesHtml = res.notes.map(n => `<li>${n}</li>`).join('');
  lastScore[task.id] = res;
  if (best[task.id] == null || res.pct > best[task.id]) { best[task.id] = res.pct; saveBest(); }
  renderTabs(); renderTable(); renderKz(); renderResult();
  $('result').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

/* =====================================================================
   Ereignisse
   ===================================================================== */
function onEdit(e) {
  const tr = e.target.closest('tr'); if (!tr) return;
  const r = getRows().find(x => String(x.id) === tr.dataset.id); if (!r) return;
  const c = e.target.classList;
  if (c.contains('vz')) { r.sign = e.target.value; e.target.classList.toggle('vz-empty', r.sign === ''); }
  else if (c.contains('nm')) { r.name = e.target.value; fitNameCol(); }
  else if (c.contains('p1')) r.p1 = e.target.value;
  else if (c.contains('p2')) r.p2 = e.target.value;
  else if (c.contains('amt')) r.amt = e.target.value;
  else return;
  r.st = null;
  tr.querySelectorAll('.ok,.bad,.follow,.neutral').forEach(el => el.classList.remove('ok', 'bad', 'follow', 'neutral'));
}
$('rows').addEventListener('input', onEdit);
$('rows').addEventListener('change', onEdit);
$('rows').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const tr = b.closest('tr'); const rows = getRows();
  const i = rows.findIndex(x => String(x.id) === tr.dataset.id); if (i < 0) return;
  if (b.classList.contains('del')) {
    rows.splice(i, 1);
    if (!rows.length) rows.push(newRow());
    renderTable();
  } else if (b.classList.contains('up')) {
    const nr = newRow(); rows.splice(i, 0, nr); renderTable(nr.id);
  }
});
$('btn-top').addEventListener('click', () => { const nr = newRow(); getRows().unshift(nr); renderTable(nr.id); });
$('btn-bottom').addEventListener('click', () => { const nr = newRow(); getRows().push(nr); renderTable(nr.id); });
$('btn-check').addEventListener('click', check);
$('btn-reset').addEventListener('click', async () => {
  if (!(await ask('Alle Eingaben dieser Aufgabe löschen?', 'Löschen'))) return;
  const id = TASKS[cur].id; delete rowsByTask[id]; delete lastScore[id]; delete kzState[id]; renderAll();
});

// Kennzahl-Felder
$('kz-list').addEventListener('input', e => {
  const el = e.target; const box = el.closest('.kz');
  if (!box || !el.dataset.f) return;
  const s = getKz(TASKS[cur].id, box.dataset.kz);
  s[el.dataset.f] = el.value; s.st = null;
  box.querySelectorAll('input').forEach(i => i.classList.remove('ok', 'bad', 'follow'));
  box.querySelector('.live').textContent = liveText(s);
});

/* =====================================================================
   Taschenrechner (Knopf oben rechts, standardmäßig aus, Verlauf der letzten 5)
   ===================================================================== */
const CALC_KEY = 'ksk-lernapp-calc';
const calc = { expr: '', hist: [], fresh: false };
function calcOut(v) { return String(+v.toFixed(8)).replace('.', ','); }
// Schrift verkleinern, bis der Text ins Feld passt (statt abzuschneiden)
function fitText(el, minPx) {
  el.style.fontSize = '';
  let s = parseFloat(getComputedStyle(el).fontSize);
  while (el.scrollWidth > el.clientWidth && s > minPx) { s -= 0.5; el.style.fontSize = s + 'px'; }
  el.scrollLeft = el.scrollWidth;
}
function calcRender() {
  const disp = $('calc-disp');
  disp.textContent = calc.expr || '0';
  $('calc-hist').innerHTML = calc.hist.slice().reverse().map(h => `<div title="${esc(h.e)} = ${esc(h.r)}">${esc(h.e)} = ${esc(h.r)}</div>`).join('');
  if ($('calc').classList.contains('show')) {
    fitText(disp, 11);
    document.querySelectorAll('#calc-hist div').forEach(d => fitText(d, 8));
  }
}
function calcPress(k) {
  if (k === 'C') { calc.expr = ''; calc.fresh = false; }
  else if (k === '⌫') { calc.expr = calc.expr.slice(0, -1); calc.fresh = false; }
  else if (k === '=') {
    const v = evalExpr(calc.expr);
    if (v == null) { $('calc-disp').textContent = 'Fehler'; return; }
    const out = calcOut(v);
    calc.hist.push({ e: calc.expr, r: out });
    if (calc.hist.length > 5) calc.hist.shift();
    calc.expr = out; calc.fresh = true;
  } else {
    if (calc.fresh && /[0-9,(]/.test(k)) calc.expr = '';
    calc.fresh = false;
    calc.expr += k;
  }
  calcRender();
}
function setCalc(open) {
  $('calc').classList.toggle('show', open);
  $('btn-calc').setAttribute('aria-pressed', open ? 'true' : 'false');
  try { localStorage.setItem(CALC_KEY, open ? '1' : '0'); } catch (e) {}
  if (open) { $('calc').focus(); calcRender(); }
  calcSpace();
}
// Solange der Rechner offen ist, bekommt die Seite unten Platz, damit alles (z. B. "Fertig") darüber gescrollt werden kann
function calcSpace() {
  const c = $('calc');
  document.body.style.paddingBottom = c.classList.contains('show') ? (c.offsetHeight + 24) + 'px' : '';
}
window.addEventListener('resize', () => { try { calcSpace(); } catch (e) {} });
$('btn-calc').addEventListener('click', () => setCalc(!$('calc').classList.contains('show')));
$('calc-keys').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { calcPress(b.dataset.k); $('calc').focus(); } });
$('calc').addEventListener('keydown', e => {
  const map = { '*': '×', '/': '÷', '-': '−', '.': ',', Enter: '=', Backspace: '⌫', Escape: 'C' };
  let k = map[e.key] || e.key;
  if (/^[0-9,+−×÷()%=⌫C]$/.test(k)) { e.preventDefault(); calcPress(k); }
});
try { if (localStorage.getItem(CALC_KEY) === '1') setCalc(true); } catch (e) {}
calcRender();

/* =====================================================================
   Entwurf speichern (Handy und Computer, nur auf diesem Gerät)
   ===================================================================== */
const DRAFT_KEY = 'ksk-lernapp-draft';
let saveTimer = null;
function saveDraft() {
  try {
    const d = { cur, tasks: {} };
    TASKS.forEach(t => {
      const rows = rowsByTask[t.id], kz = kzState[t.id];
      if (!rows && !kz) return;
      d.tasks[t.id] = {
        rows: (rows || []).map(r => ({ sign: r.sign, name: r.name, p1: r.p1, p2: r.p2, amt: r.amt })),
        kz: Object.fromEntries(Object.entries(kz || {}).map(([k, v]) => [k, { z: v.z, n: v.n, s: v.s }]))
      };
    });
    localStorage.setItem(DRAFT_KEY, JSON.stringify(d));
  } catch (e) {}
}
function scheduleSave() { clearTimeout(saveTimer); saveTimer = setTimeout(saveDraft, 300); }
function loadDraft() {
  try {
    const d = JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null');
    if (!d || !d.tasks) return;
    TASKS.forEach((t, i) => {
      const x = d.tasks[t.id]; if (!x) return;
      if (Array.isArray(x.rows) && x.rows.length) {
        rowsByTask[t.id] = x.rows.slice(0, 60).map(r => Object.assign(newRow(), { sign: String(r.sign || ''), name: String(r.name || ''), p1: String(r.p1 || ''), p2: String(r.p2 || ''), amt: String(r.amt || '') }));
      }
      Object.entries(x.kz || {}).forEach(([id, v]) => { if (KZ[id]) Object.assign(getKz(t.id, id), { z: String(v.z || ''), n: String(v.n || ''), s: String(v.s || '') }); });
    });
    if (Number.isInteger(d.cur) && d.cur >= 0 && d.cur < TASKS.length) cur = d.cur;
  } catch (e) {}
}
document.addEventListener('input', scheduleSave);
document.addEventListener('change', scheduleSave);
document.addEventListener('click', () => setTimeout(scheduleSave, 0));
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') saveDraft(); });
window.addEventListener('pagehide', saveDraft);

loadDraft();
renderAll();
</script>
