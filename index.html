<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>KSK Kalkulationstrainer</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <h1>KSK Kalkulationstrainer</h1>
  <button class="calc-toggle" id="btn-calc" aria-pressed="false">Taschenrechner</button>
</header>

<main>
  <div class="tabs" id="tabs"></div>

  <div class="card task-card" id="task-card">
    <div class="task-head"><strong>Aufgabe</strong></div>
    <div class="task" id="task-text"></div>
    <div class="task-hint" id="task-hint"></div>
  </div>

  <div class="card" id="table-card">
    <h3 class="part-title" id="table-title"></h3>
    <div class="pct-opt"><label><input type="checkbox" id="pct-toggle" checked> Prozent-Hilfe anzeigen</label><span class="muted">Die Prozentspalten sind nur eine Hilfe und werden nicht bewertet.</span></div>
    <div class="bar-actions top"><button class="btn small" id="btn-top">+ Zeile ganz oben</button></div>
    <div class="wrap">
      <table class="sheet" id="sheet">
        <colgroup><col style="width:var(--w-vz,78px)"><col id="col-nm" style="width:110px"><col class="col-p" style="width:var(--w-p,84px)"><col class="col-p" style="width:var(--w-p,84px)"><col style="width:var(--w-amt,140px)"><col style="width:var(--w-act,84px)"></colgroup>
        <thead><tr><th>Vz</th><th>Bezeichnung</th><th class="hp">% (Hilfe)</th><th class="hp">% (Hilfe)</th><th>Betrag</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="bar-actions"><button class="btn small" id="btn-bottom">+ Zeile ganz unten</button></div>
  </div>

  <div id="kz-card" style="display:none"><div id="kz-list"></div></div>

  <div class="bar-actions" style="justify-content:flex-end; margin: 0 0 14px">
    <button class="btn" id="btn-reset">Neu beginnen</button>
    <button class="btn primary" id="btn-check">Fertig</button>
  </div>

  <div class="card result" id="result">
    <div class="score"><span class="big" id="score-big"></span><span class="note" id="score-note"></span></div>
    <div class="meter"><div id="score-bar"></div></div>
    <div class="parts-line" id="score-parts"></div>
    <h4 class="res-h" id="res-table-title"></h4>
    <div class="wrap" id="res-table-wrap"><table class="res"><thead><tr><th>Soll</th><th>Bezeichnung</th><th>Vz</th><th>Betrag</th><th>Reihenfolge</th><th>Prozent (nicht gewertet)</th></tr></thead><tbody id="res-rows"></tbody></table></div>
    <div class="res-kz wrap" id="res-kz"></div>
    <ul class="notes" id="res-notes"></ul>
    <p class="legend" id="legend"></p>
  </div>
</main>

<div class="calc" id="calc" tabindex="0" aria-label="Taschenrechner">
  <div class="hist" id="calc-hist"></div>
  <div class="disp" id="calc-disp">0</div>
  <div class="keys" id="calc-keys">
    <button data-k="C">C</button><button data-k="⌫">⌫</button><button data-k="%">%</button><button class="op" data-k="÷">÷</button>
    <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button><button class="op" data-k="×">×</button>
    <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button><button class="op" data-k="−">−</button>
    <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button><button class="op" data-k="+">+</button>
    <button data-k="(">(</button><button data-k="0">0</button><button data-k=",">,</button><button data-k=")">)</button>
    <button class="eq wide" data-k="=" style="grid-column: span 4">=</button>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="dialog" role="dialog" aria-modal="true">
    <p id="dlg-text"></p>
    <div class="row"><button class="btn" id="dlg-no">Abbrechen</button><button class="btn primary" id="dlg-yes">Ja</button></div>
  </div>
</div>

<script src="js/schema.js"></script>
<script src="js/helpers.js"></script>
<script src="js/tasks.js"></script>
<script src="js/state.js"></script>
<script src="js/render.js"></script>
<script src="js/evaluate.js"></script>
<script src="js/events.js"></script>
<script src="js/calc.js"></script>
<script src="js/draft.js"></script>
</body>
</html>
